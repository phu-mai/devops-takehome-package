apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quote-api.fullname" . }}
  labels:
    {{- include "quote-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "quote-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "quote-api.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.service.targetPort }}"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: acme.io/capacity
                    operator: In
                    values:
                      {{- toYaml .Values.placement.requiredCapacityIn | nindent 22 }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: {{ .Values.placement.preferSpotWeight }}
              preference:
                matchExpressions:
                  - key: acme.io/capacity
                    operator: In
                    values:
                      - spot
      topologySpreadConstraints:
        - maxSkew: {{ .Values.placement.capacitySpread.maxSkew }}
          topologyKey: acme.io/capacity
          whenUnsatisfiable: {{ .Values.placement.capacitySpread.whenUnsatisfiable }}
          minDomains: {{ .Values.placement.capacitySpread.minDomains }}
          labelSelector:
            matchLabels:
              {{- include "quote-api.selectorLabels" . | nindent 14 }}
        - maxSkew: {{ .Values.placement.hostnameSpread.maxSkew }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ .Values.placement.hostnameSpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "quote-api.selectorLabels" . | nindent 14 }}
      containers:
        - name: quote-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
